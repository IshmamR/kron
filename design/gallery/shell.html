    #kron-gallery-workflows .kr *,#kron-gallery-workflows .kr *::before,#kron-gallery-workflows .kr *::after { box-sizing:border-box; }
    #kron-gallery-workflows [hidden] { display:none!important; }
    #kron-gallery-workflows .kr h1,#kron-gallery-workflows .kr h2,#kron-gallery-workflows .kr h3,#kron-gallery-workflows .kr p { margin:0; }
    #kron-gallery-workflows .kr button,#kron-gallery-workflows .kr input,#kron-gallery-workflows .kr select,#kron-gallery-workflows .kr textarea { font:inherit;color:inherit; }
    #kron-gallery-workflows .kr button { border:0;background:transparent;padding:0; }
    #kron-gallery-workflows .kr button:disabled { opacity:.42; }
    #kron-gallery-workflows .kr svg,#kron-gallery-workflows .kr i[data-lucide] { width:17px;height:17px;flex:none;vertical-align:middle; }
    #kron-gallery-workflows .kr .kr-row { display:flex;align-items:center;gap:8px;min-width:0; }
    #kron-gallery-workflows .kr .kr-spacer { flex:1; }
    #kron-gallery-workflows .kr .kr-secondary { color:var(--kr-secondary); }
    #kron-gallery-workflows .kr .kr-caption { font-size:11px;color:var(--kr-secondary); }
    #kron-gallery-workflows .kr .kr-traffic { display:flex;align-items:center;gap:8px;flex:none; }
    #kron-gallery-workflows .kr .kr-traffic span { width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 1px #00000012; }
    #kron-gallery-workflows .kr .kr-traffic span:nth-child(2) { background:#febc2e; }
    #kron-gallery-workflows .kr .kr-traffic span:nth-child(3) { background:#28c840; }
    #kron-gallery-workflows .kr .kr-tool { display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:6px 8px;min-height:30px;border-radius:6px;white-space:nowrap;color:var(--kr-secondary); }
    #kron-gallery-workflows .kr .kr-tool:hover { background:var(--kr-soft);color:var(--kr-ink); }
    #kron-gallery-workflows .kr .kr-control { display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:5px 12px;min-height:29px;border:1px solid var(--kr-line);border-radius:6px;background:var(--kr-surface);box-shadow:0 1px 2px var(--kr-shadow);white-space:nowrap; }
    #kron-gallery-workflows .kr .kr-control.kr-primary { border-color:var(--kr-accent);background:var(--kr-accent);color:var(--kr-on-accent); }
    #kron-gallery-workflows .kr .kr-link { color:var(--kr-accent);display:inline-flex;align-items:center;gap:5px;min-height:27px;text-align:left; }
    #kron-gallery-workflows .kr .kr-link svg { width:13px;height:13px; }
    #kron-gallery-workflows .kr .kr-segment { display:inline-flex;gap:2px;align-items:center;padding:3px;background:var(--kr-soft);border-radius:7px; }
    #kron-gallery-workflows .kr .kr-segment button { font-size:12px;padding:4px 11px;min-height:25px;border-radius:5px;color:var(--kr-secondary);white-space:nowrap; }
    #kron-gallery-workflows .kr .kr-segment button[aria-pressed="true"] { background:var(--kr-surface);box-shadow:0 1px 3px var(--kr-shadow);color:var(--kr-ink);font-weight:600; }
    #kron-gallery-workflows .kr .kr-count { margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;color:var(--kr-secondary); }
    #kron-gallery-workflows .kr .kr-scroll { overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--kr-line) transparent;min-height:0;min-width:0; }
    #kron-gallery-workflows .kr .kr-search { display:flex;gap:6px;align-items:center;border:1px solid var(--kr-line);background:var(--kr-surface);border-radius:6px;padding:5px 8px;color:var(--kr-secondary); }
    #kron-gallery-workflows .kr .kr-search svg { width:14px;height:14px; }
    #kron-gallery-workflows .kr .kr-search input { min-width:0;width:100%;border:0;padding:0;background:transparent; }
    #kron-gallery-workflows .kr .kr-search input::placeholder { color:var(--kr-secondary);opacity:1; }
    #kron-gallery-workflows .kr .kr-empty { padding:55px 24px;text-align:center;color:var(--kr-secondary); }

    /* Gallery: persistent library sidebar, paper directly on the window surface. */
    #kron-gallery-workflows .kr-gallery { display:grid;grid-template-columns:196px minmax(0,1fr); }
    #kron-gallery-workflows .kr .kr-sidebar { display:flex;flex-direction:column;min-width:0;min-height:0;padding:0 11px 13px;background:var(--kr-side);border-right:1px solid var(--kr-hair); }
    #kron-gallery-workflows .kr .kr-side-titlebar { height:64px;display:flex;align-items:center;padding:0 9px;gap:12px; }
    #kron-gallery-workflows .kr .kr-side-heading { margin:11px 11px 7px;font-size:11px;font-weight:600;color:var(--kr-secondary); }
    #kron-gallery-workflows .kr .kr-nav { display:flex;align-items:center;gap:9px;min-height:34px;width:100%;border-radius:6px;padding:7px 10px;text-align:left;margin:2px 0; }
    #kron-gallery-workflows .kr .kr-nav svg { color:var(--kr-accent); }
    #kron-gallery-workflows .kr .kr-nav[aria-current="page"],#kron-gallery-workflows .kr .kr-nav[aria-pressed="true"] { background:var(--kr-selection);font-weight:600; }
    #kron-gallery-workflows .kr .kr-filter-nav { padding-left:32px;font-size:12px;color:var(--kr-secondary);min-height:31px; }
    #kron-gallery-workflows .kr .kr-filter-nav[aria-pressed="true"] { color:var(--kr-ink);background:var(--kr-soft);font-weight:600; }
    #kron-gallery-workflows .kr .kr-side-bottom { margin-top:auto;padding-top:22px; }
    #kron-gallery-workflows .kr .kr-person { border-top:1px solid var(--kr-line);margin:12px 8px 0;padding-top:15px;display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600; }
    #kron-gallery-workflows .kr .kr-avatar { width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:var(--kr-selection);color:var(--kr-accent);font-size:10px;letter-spacing:.2px; }
    #kron-gallery-workflows .kr .kr-person small { display:block;font-weight:400;font-size:11px;color:var(--kr-secondary);margin-top:2px; }
    #kron-gallery-workflows .kr .kr-gallery-main { min-width:0;min-height:0;display:flex;flex-direction:column; }
    #kron-gallery-workflows .kr .kr-library-bar { padding:0 32px;height:80px;display:flex;align-items:center;gap:13px;flex:none; }
    #kron-gallery-workflows .kr .kr-library-bar h1 { font-size:23px;font-weight:650;letter-spacing:-.75px;line-height:1.15; }
    #kron-gallery-workflows .kr .kr-library-bar .kr-heading-count { color:var(--kr-secondary);font-size:13px;align-self:center; }
    #kron-gallery-workflows .kr .kr-library-bar .kr-search { width:180px; }
    #kron-gallery-workflows .kr .kr-library-bar select { border:0;background:transparent;max-width:130px;font-size:12px;color:var(--kr-secondary); }
    #kron-gallery-workflows .kr .kr-document-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:33px 30px;padding:10px 34px 38px;align-content:start; }
    #kron-gallery-workflows .kr .kr-document { min-width:0;width:100%;text-align:left;display:block;border-radius:6px; }
    #kron-gallery-workflows .kr .kr-preview { height:264px;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:15px; }
